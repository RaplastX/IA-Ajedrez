apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia-ajedrez-web
  labels: { app: ia-ajedrez-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ia-ajedrez-web }
  template:
    metadata:
      labels: { app: ia-ajedrez-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/OWNER/ia-ajedrez-web:latest
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: ia-ajedrez-web
spec:
  selector: { app: ia-ajedrez-web }
  ports:
    - port: 8080
      targetPort: 8080
---
# El nginx de la imagen web hace proxy de /api y /ws al host "api"; en Kubernetes se resuelve con
# este alias al Service de la API.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ExternalName
  externalName: ia-ajedrez-api.default.svc.cluster.local
