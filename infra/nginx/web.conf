# nginx para la app web (SPA + PWA) y proxy de la API en la misma origen.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Stockfish (WASM) necesita 'wasm-unsafe-eval'; la tablebase de Lichess se consulta desde el navegador.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://tablebase.lichess.ovh wss: ws:; frame-ancestors 'none'" always;

  # Ojo: un add_header dentro de un location anula los de arriba; por eso la caché se
  # controla con `expires` y las cabeceras de seguridad se heredan en todas las rutas.

  # Recursos con hash en el nombre: caché larga.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Motor: el .wasm debe servirse como application/wasm.
  location /engine/ {
    types { application/javascript js; application/wasm wasm; text/plain txt; }
    expires 30d;
    try_files $uri =404;
  }

  location = /sw.js {
    expires -1;
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  # SPA: cualquier ruta desconocida sirve index.html.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
