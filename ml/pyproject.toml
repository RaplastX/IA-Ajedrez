[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ajedrez-ml"
version = "0.1.0"
description = "Preprocesado de partidas, generación de puzzles, RL de dificultad y modelos para IA Ajedrez"
requires-python = ">=3.10"
dependencies = ["chess>=1.10", "numpy>=1.26"]

[project.optional-dependencies]
train = ["torch>=2.2"]
nlp = ["transformers>=4.44", "datasets>=2.20", "sentencepiece", "accelerate"]
lichess = ["zstandard>=0.22"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["ajedrez_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"
